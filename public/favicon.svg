<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="echowave-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#18132d"/>
      <stop offset="100%" stop-color="#0b172a"/>
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="echowave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Secondary Wave Gradient -->
    <linearGradient id="echowave-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Top Sheen Gradient -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Sheen -->
  <rect width="512" height="512" rx="128" fill="url(#echowave-bg)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="url(#echowave-grad)" stroke-width="6" stroke-opacity="0.4"/>
  <rect x="6" y="6" width="500" height="240" rx="122" fill="url(#sheen)"/>

  <!-- Echo Wave Acoustic Crest Graphic -->
  <g transform="translate(0, 0)">
    <!-- Echo Concentric Resonance Arcs (Left - "Echo") -->
    <path d="M 120 180 A 90 90 0 0 0 120 332" fill="none" stroke="url(#echowave-grad)" stroke-width="18" stroke-linecap="round" opacity="0.4"/>
    <path d="M 160 205 A 55 55 0 0 0 160 307" fill="none" stroke="url(#echowave-grad)" stroke-width="18" stroke-linecap="round" opacity="0.75"/>
    <circle cx="195" cy="256" r="14" fill="url(#echowave-grad)"/>

    <!-- Central Fluid Wave Ribbon (Center - "Wave") -->
    <path d="M 200 256 C 240 256 245 150 285 150 C 325 150 330 362 370 362 C 405 362 415 256 450 256" 
          fill="none" stroke="url(#echowave-grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <path d="M 200 256 C 240 256 245 150 285 150 C 325 150 330 362 370 362 C 405 362 415 256 450 256" 
          fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Harmonic Secondary Echo Particles -->
    <circle cx="285" cy="150" r="10" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="370" cy="362" r="10" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="450" cy="256" r="12" fill="#06b6d4" filter="url(#glow)"/>
  </g>
</svg>
